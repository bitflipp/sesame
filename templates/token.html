{{define "content"}}
<h1>{{.L.T "token_heading"}}</h1>
<p class="muted">{{.L.T "token_hint" .Email}}</p>
{{if .Error}}<p class="err">{{.L.T .Error}}</p>{{end}}
<form method="post" action="/token">
  <input type="hidden" name="rd" value="{{.RD}}">
  <label for="token">{{.L.T "token_label"}}</label>
  <input id="token" name="token" inputmode="numeric" autocomplete="one-time-code" required autofocus>
  <button type="submit">{{.L.T "token_submit"}}</button>
</form>
<p class="muted"><a href="/login?rd={{.RD}}">{{.L.T "token_other_address"}}</a></p>
{{end}}
