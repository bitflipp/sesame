{{define "layout"}}<!doctype html>
<html lang="{{.L.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>{{.L.T .Title}}</title>
{{if .PasskeysEnabled}}<script src="/passkeys.js" defer></script>{{end}}
<style>
:root { color-scheme: light dark; }
body { font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
main { width: min(24rem, 90vw); }
h1 { font-size: 1.4rem; }
h2 { font-size: 1.1rem; }
input, button { font: inherit; padding: .6rem .8rem; width: 100%; box-sizing: border-box; margin-top: .5rem; }
button { cursor: pointer; }
.err { color: #c00; }
.ok { color: #070; }
.code { font-size: 3rem; font-weight: 700; opacity: .3; margin: 0; }
.muted { opacity: .7; font-size: .9rem; }
.passkeys { list-style: none; padding: 0; margin: 0; }
.passkeys li { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: .5rem; padding: .4rem 0; border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent); }
.passkey-name { font-weight: 600; }
.passkeys form { grid-column: 2; grid-row: 1 / span 2; margin: 0; }
button.link { width: auto; margin: 0; padding: 0; border: 0; background: none; color: inherit; text-decoration: underline; }
.lang { position: absolute; top: .75rem; right: .75rem; display: flex; gap: .25rem; }
.lang select, .lang button { width: auto; margin: 0; padding: .25rem .4rem; font-size: .85rem; }
</style>
</head>
<body>
<main>
{{template "content" .}}
</main>
{{with .L.Options}}<form class="lang" method="get" action="/lang">
  <input type="hidden" name="rd" value="{{$.Path}}">
  <select name="set" aria-label="{{$.L.T "lang_switch"}}" title="{{$.L.T "lang_switch"}}">{{range .}}<option value="{{.Code}}" lang="{{.Code}}"{{if .Current}} selected{{end}}>{{.Name}}</option>{{end}}</select>
  <button type="submit">{{$.L.T "lang_apply"}}</button>
</form>{{end}}
</body>
</html>{{end}}
