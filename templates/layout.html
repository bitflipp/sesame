{{define "layout"}}<!doctype html>
<html lang="{{.L.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>{{.L.T .Title}}</title>
{{if .PasskeysEnabled}}<script src="/passkeys.js" defer></script>{{end}}
<style>
/* One spacing scale for the whole portal: blocks sit --space apart, the
   contents of a control group --space-sm apart. */
:root {
  color-scheme: light dark;
  --space: 1rem;
  --space-sm: .5rem;
  --radius: .75rem;
  --accent: #6d5dfc;
  --accent-2: #2bb3f3;
  --accent-ink: #fff;
  --bg: #f4f3ff;
  --card: #fff;
  --ink: #1d1b2e;
  --err: #c0152f;
  --ok: #0a7a3d;
  --line: color-mix(in srgb, currentColor 15%, transparent);
  --shadow: 0 1px 2px rgb(30 20 80 / .06), 0 12px 40px rgb(60 40 160 / .14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --accent: #8f83ff;
    --accent-2: #4cc3ff;
    --accent-ink: #11101f;
    --bg: #0f0e1a;
    --card: #1a1830;
    --ink: #ece9ff;
    --err: #ff7088;
    --ok: #55d98e;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 12px 40px rgb(0 0 0 / .5);
  }
}
body {
  font: 16px/1.5 system-ui, sans-serif; color: var(--ink);
  min-height: 100vh; min-height: 100dvh; margin: 0; padding: var(--space); box-sizing: border-box;
  /* Three rows with equal flexible tracks above and below the card keep it
     centered. A flexible track never shrinks below its content, so once the
     viewport is too short for the language switcher to fit beside the card,
     the top row stops shrinking and the switcher sits above the card instead
     of under it. */
  display: grid; grid-template-rows: 1fr auto 1fr; gap: var(--space); place-items: center;
  background:
    radial-gradient(40rem 30rem at 10% -10%, color-mix(in srgb, var(--accent) 28%, transparent), transparent),
    radial-gradient(35rem 28rem at 100% 110%, color-mix(in srgb, var(--accent-2) 26%, transparent), transparent),
    var(--bg);
  background-attachment: fixed;
}
main {
  grid-row: 2; width: min(24rem, 90vw); padding: 1.75rem; box-sizing: border-box;
  background: var(--card); border-radius: calc(var(--radius) * 1.5); box-shadow: var(--shadow);
  animation: rise .35s ease-out;
}
@keyframes rise { from { opacity: 0; transform: translateY(.5rem); } }
@media (prefers-reduced-motion: reduce) { main { animation: none; } }
h1, h2, p, dl, dd, ul { margin: 0; }
h1 { font-size: 1.5rem; letter-spacing: -.01em; }
h2 { font-size: 1.1rem; }
main > * + * { margin-top: var(--space); }
a { color: var(--accent); }

/* Control groups: one bordered card per concern, heading first. */
.group { padding: var(--space); border: 1px solid var(--line); border-radius: var(--radius); background: color-mix(in srgb, var(--accent) 4%, transparent); }
.group > * + * { margin-top: var(--space-sm); }
.group > form { margin-top: var(--space); }

/* Identity: label/value rows rather than loose lines. */
.identity { display: grid; grid-template-columns: auto 1fr; gap: var(--space-sm) var(--space); }
.identity dt { opacity: .7; font-size: .9rem; }
.identity dd { overflow-wrap: anywhere; font-weight: 500; }

input, button, select { font: inherit; }
input, button { width: 100%; padding: .65rem .85rem; box-sizing: border-box; border-radius: var(--radius); }
input { color: inherit; background: transparent; border: 1px solid var(--line); border-color: color-mix(in srgb, currentColor 28%, transparent); }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
button { cursor: pointer; font-weight: 600; color: var(--accent-ink); border: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 35%, transparent); transition: transform .12s, filter .12s; }
button:hover { filter: brightness(1.08); transform: translateY(-1px); }
button:active { transform: none; }
form { display: grid; gap: var(--space-sm); }
label { font-size: .9rem; font-weight: 500; }

.err { color: var(--err); }
.ok { color: var(--ok); }
.muted { opacity: .7; font-size: .9rem; }
.code { font-size: 3.5rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#token { font-size: 1.5rem; letter-spacing: .3em; text-align: center; font-variant-numeric: tabular-nums; }

.passkeys { list-style: none; padding: 0; }
.passkeys li { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: var(--space); padding: var(--space-sm) 0; border-bottom: 1px solid var(--line); }
.passkeys li:last-child { border-bottom: 0; }
.passkey-name { font-weight: 600; }
.passkeys form { grid-column: 2; grid-row: 1 / span 2; }
button.link { width: auto; padding: 0; border: 0; background: none; box-shadow: none; color: var(--err); font-weight: 500; text-decoration: underline; }
button.link:hover { transform: none; }

/* The switcher lives in the top row's corner; see body for how it yields. */
.lang { grid-row: 1; place-self: start end; display: flex; flex-wrap: wrap; justify-content: end; gap: var(--space-sm); font-size: .85rem; }
.lang a { padding: .25rem .6rem; border-radius: 999px; text-decoration: none; color: inherit; background: var(--card); }
.lang a:hover { color: var(--accent); }
.lang a[aria-current] { color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight: 600; }
</style>
</head>
<body>
<main>
{{template "content" .}}
</main>
{{with .L.Options}}<nav class="lang" aria-label="{{$.L.T "lang_switch"}}">{{range .}}<a href="/lang?set={{.Code}}&amp;rd={{$.Path}}" lang="{{.Code}}" hreflang="{{.Code}}"{{if .Current}} aria-current="true"{{end}}>{{.Name}}</a>{{end}}</nav>{{end}}
</body>
</html>{{end}}
